name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 6"
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    uses: groovemap-music/automation/.github/workflows/reusable-ci.yml@dacd84051e0c7c8bec7b2e489f37d57c7f1cdb20
    with:
      runner: ubuntu-24.04
      language: mixed
      setup-command: just setup
      check-command: just check
      coverage-command: just coverage
      audit-command: just audit
      license-command: just license-check
      secret-scan-command: just source-check
      package-command: just build
      install-command: just install-check
      image-command: just image
      e2e-setup-command: just e2e-setup
      e2e-instrument-command: just e2e-instrument
      e2e-command: just e2e-run
      e2e-post-command: just e2e-post
      coverage-files: |
        coverage.xml
        coverage/javascript/lcov.info
        coverage/e2e/lcov.info
      browser-coverage-mapping: >-
        [{"project":"chromium","lcov":"coverage/e2e/chromium/lcov.info","artifacts":["test-results/chromium","coverage/e2e/raw/chromium"]},
        {"project":"firefox","lcov":"coverage/e2e/firefox/lcov.info","artifacts":["test-results/firefox","coverage/e2e/raw/firefox"]},
        {"project":"webkit","lcov":"coverage/e2e/webkit/lcov.info","artifacts":["test-results/webkit","coverage/e2e/raw/webkit"]},
        {"project":"iphone","lcov":"coverage/e2e/iphone/lcov.info","artifacts":["test-results/iphone","coverage/e2e/raw/iphone"]},
        {"project":"ipad","lcov":"coverage/e2e/ipad/lcov.info","artifacts":["test-results/ipad","coverage/e2e/raw/ipad"]}]
      coverage-flags: python,javascript,e2e,operations
      upload-codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
