name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: groovemap-music/.github/.github/workflows/reusable-ci.yml@main
    with:
      runner: ubuntu-24.04
      requires-private-library: true
      setup-command: just setup
      check-command: just check
      fallback-command: just source-check
      audit-command: just audit
      image-command: just image
      coverage-command: npm run test:coverage
      e2e-setup-command: uv run playwright install --with-deps chromium
      e2e-command: just e2e
      coverage-flags: python,javascript,e2e,operations
    secrets: inherit
