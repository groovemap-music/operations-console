name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@dacd84051e0c7c8bec7b2e489f37d57c7f1cdb20
    with:
      repository-name: operations-console
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: |
        dist/*.whl
        dist/*.tar.gz
        dist/provenance.json
      publish-image: true
      prepare-image-command: just prepare-runtime-wheel
